spring:
  application:
    name: api-flow-dashboard

server:
  port: 8080

logging:
  level:
    com.socgen.unibank: INFO

vault:
  enabled: false        # set VAULT_ENABLED=true in real environments (matches existing launch script)
  uri: ${VAULT_URI:}
  namespace: ${VAULT_NAMESPACE:}
  role-id: ${VAULT_ROLE_ID:}
  secret-id: ${VAULT_SECRET_ID:}
  kv-mount: secret
  trigram: abb
  env: prd
  secret-name: default

dashboard:
  endpoint-key-suffix: ".endpoint"
  strip-prefixes:
    - "unibank.services."
    - "unibank.service."
  service-name-suffixes:
    - "-service"
    - "_service"
    - ".service"
  excluded-url-prefixes:
    - "https://pvip"
  excluded-services:
    - "VAULT_L1"
  bridge-connector-prefix: "unibank.bridge.connectors."
  config-refresh-interval: 60s
  health-check-interval: 20s
  health-check-timeout: 3s
  trust-all-certs-for-health-checks: true
